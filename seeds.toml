# Seeds: crawler yahan se shuru karta hai. Apni pasand ki sites yahan daalein
# (ya search box mein admin ke tor par:  /add https://site.com  ).
# type = "feed"    -> RSS/Atom (taaza khabrein, har ~30 min)
# type = "page"    -> normal page, links follow honge (sirf allowed domains ke andar)
# type = "sitemap" -> sitemap.xml se saare URLs
#
# NOTE: ye URLs mere test sandbox se verify nahi ho sake (wahan internet nahi). Agar koi feed band/badal
# gayi ho to crawler use skip kar ke aage barhta hai; "admin -> frontier" mein error nazar aa jata hai.

