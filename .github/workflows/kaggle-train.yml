name: kaggle-train
# Hafte mein ek baar (aur manually): live site se passages -> Kaggle dataset -> Kaggle GPU par teacher + LoRA training ->
# GGUF model GitHub Release `model-latest` mein. Free. Zaroorat: repo Secrets KAGGLE_USERNAME aur KAGGLE_KEY.
on:
  schedule:
    - cron: "30 2 * * 0"
    - cron: "30 2 * * 3"     # GitHub cron kabhi chhoot jata hai (22 Nov ko chhuta): Budh ko dobara; model 6 din se naya ho to khud skip
  workflow_dispatch:
    inputs:
      passages:
        description: "Kitne passages export karne hain"
        default: "2000"
permissions:
  contents: write
concurrency:
  group: kaggle-train
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      SITE_URL: ${{ vars.AUTOPILOT_URL || 'http://137.23.39.13:8000' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Secrets check
        id: sec
        run: |
          if [ -z "$KAGGLE_KEY" ] || [ -z "$KAGGLE_USERNAME" ]; then
            echo "::warning::KAGGLE_USERNAME / KAGGLE_KEY secrets nahi mile - is run ko chhod diya"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            age=$(gh api "repos/${{ github.repository }}/releases/tags/model-latest" -q '(now - (.published_at|fromdate))|floor' 2>/dev/null || echo 99999999)
            if [ "$age" -lt 518400 ]; then echo "::notice::model sirf $((age/3600)) ghante purana hai - is hafte training ho chuki, skip"; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
          fi
      - uses: actions/checkout@v4
        if: steps.sec.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.sec.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        if: steps.sec.outputs.ok == 'true'
        run: pip install -r requirements.txt kaggle six
      - name: Kaggle login
        if: steps.sec.outputs.ok == 'true'
        run: |
          mkdir -p ~/.kaggle
          if [[ "$KAGGLE_KEY" == KGAT_* ]]; then
            printf '%s' "$KAGGLE_KEY" > ~/.kaggle/access_token
            echo "KAGGLE_API_TOKEN=$KAGGLE_KEY" >> "$GITHUB_ENV"
          else
            printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
          fi
          chmod 600 ~/.kaggle/* || true
      - name: Export passages from the live site
        if: steps.sec.outputs.ok == 'true'
        run: python -m engine export-train --url "$SITE_URL" --n "${{ github.event.inputs.passages || '2000' }}" --out kaggle/dataset --user "$KAGGLE_USERNAME"
      - name: Upload Kaggle dataset
        if: steps.sec.outputs.ok == 'true'
        run: |
          kaggle datasets create -p kaggle/dataset || kaggle datasets version -p kaggle/dataset -m "refresh $(date -u +%F)"
          sleep 90
      - name: Push the training notebook
        if: steps.sec.outputs.ok == 'true'
        run: |
          mkdir -p kernel && cp kaggle/train.py kernel/
          sed "s/__USER__/$KAGGLE_USERNAME/g" kaggle/kernel-metadata.json > kernel/kernel-metadata.json
          for i in 1 2 3 4 5; do
            kaggle kernels push -p kernel && exit 0
            echo "push fail ($i), dataset abhi process ho raha hoga - dobara"; sleep 60
          done
          exit 1
      - name: Wait for Kaggle run
        if: steps.sec.outputs.ok == 'true'
        run: |
          for i in $(seq 1 66); do
            out="$(kaggle kernels status "$KAGGLE_USERNAME/talashly-train" 2>&1 || true)"
            echo "$(date -u +%T) $out"
            st="$(printf '%s' "$out" | head -3 | grep -oiE 'complete|error|cancel[a-z]*|running|queued|new' | head -1 | tr a-z A-Z || true)"
            case "$st" in *COMPLETE*) exit 0;; *ERROR*|*CANCEL*) echo "Kaggle run fail: $st"; exit 1;; esac
            sleep 300
          done
          echo "Time out"; exit 1
      - name: Download output
        if: steps.sec.outputs.ok == 'true' && always()
        run: |
          mkdir -p out && kaggle kernels output "$KAGGLE_USERNAME/talashly-train" -p out || true
          ls -la out || true
          { echo "### Kaggle training"; echo '```'; cat out/status.json 2>/dev/null; echo; tail -30 out/log.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish model to Release
        if: steps.sec.outputs.ok == 'true'
        run: |
          f="$(ls out/*.gguf 2>/dev/null | head -1)"
          if [ -z "$f" ]; then echo "GGUF nahi bana (log upar dekhein)"; exit 1; fi
          (cd out && zip -qr lora.zip lora 2>/dev/null || true)
          gh release delete model-latest --cleanup-tag -y 2>/dev/null || true
          files=("$f"); for x in out/status.json out/lora.zip out/training_data.jsonl; do [ -f "$x" ] && files+=("$x"); done
          gh release create model-latest "${files[@]}" --title "Talashly model (latest)" \
            --notes "Qwen3-1.7B LoRA fine-tune (Kaggle GPU), $(date -u +%F). Chalane ke liye: deploy/fetch-model.sh" --latest=false
