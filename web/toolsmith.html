<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talashly Code</title><meta name="description" content="Describe a tool, website or script. Get complete working code.">
<link rel="icon" href="/static/icon.svg"><link rel="stylesheet" href="/static/toolsmith.css?v=4"></head>
<body>
<main id="app">
  <header><h1>Talashly Code</h1><p id="sub">Batayein kya banana hai: website, script, bot ya tool. Poora chalne wala code milega.</p></header>
  <div id="list" aria-live="polite"></div>
</main>
<form id="form" autocomplete="off">
  <div class="box"><textarea id="q" rows="1" maxlength="8000" placeholder="Apna prompt likhein (detail jitni zyada, utna behtar)..." aria-label="Prompt"></textarea>
  <button id="go" type="submit" aria-label="Send">↑</button></div>
  <div id="note" class="note"></div>
</form>
<script src="/static/toolsmith.js?v=4"></script>
</body></html>
