# Talashly v2 - configuration
# Har setting ka safe default hai: koi line mita dein ya ghalat likh dein to system chalta rehta hai
# (ghalat value khud theek ho jati hai; "python -m engine doctor" / DOCTOR.bat bata deta hai kya theek kiya).

[general]
db_path = "data/index.db"
user_agent = "TalashlyBot/2.0 (polite crawler)"

[crawler]
concurrency = 2                 # kitne pages ek saath
per_domain_delay = 3.0          # ek hi site par do requests ke beech seconds (site ka Crawl-delay ho to wo)
request_timeout = 20
max_page_bytes = 2000000
max_depth = 2                   # seed se kitne links door tak
max_pages_per_domain = 2000
respect_robots = true
use_sitemaps = true             # robots.txt mein diye sitemap se saare pages khud dhoondo (false: sirf seeds + links)
min_text_chars = 400            # is se chhota (junk) content store nahi hota
# Crawler kab chalay (Asia/Karachi = +5). 24/7 ke liye ["00:00-24:00"].
# Misal: raat ko heavy crawl, din mein halka: ["00:00-08:00", "22:00-24:00"]
active_hours = ["00:00-09:00", "13:00-15:00"]   # din mein user ke liye CPU khali (Oracle Micro bohat chhota hai)
timezone_offset_hours = 5

[recrawl]
news_minutes = 30               # feeds
default_hours = 24              # normal pages (jo badalte hain jaldi, jo nahi badalte der se)
max_hours = 168

[search]
default_limit = 8
recency_half_life_days = 30

[llm]
# Optional: apna LOCAL model (llama.cpp server) - third-party API nahi. Band ho to extractive jawab.
enabled = false
base_url = "http://127.0.0.1:8081"

[server]
host = "127.0.0.1"              # sirf is PC se. Doosre devices ke liye "0.0.0.0" (to require_key = true karein!)
port = 8000
require_key = false             # true: har user ko API key chahiye (ADD_USER.bat)
workers = 2                     # background tasks (lambi research) ke liye
rate_per_min = 60               # bina key wale (anonymous) users ki limit

[brain]
live_research = true            # index mein jawab kamzor ho to sawal ke dauran live sources se lao
live_timeout_s = 12
live_fetch_max = 6
weak_coverage = 0.6             # query ke itne fi-sad alfaaz top results mein na hon to "kamzor"
auto_expand = true              # bahut si sites jis domain ko link karein, usay khud add karo
expand_votes = 5
max_domains = 300               # auto-expand ki hadd
gap_retries = 3

[maintenance]
max_db_mb = 1500                # is se bara ho to sab se purane pages hatao
backup_keep = 7                 # rozana backup, itne rakho
check_every_s = 1800            # self-check/repair kitni der baad
stuck_after_s = 300             # crawler itni der "atka" rahe to restart

[code]
paths = []                      # start par ye folders khud index honge, misal ["C:/projects/myapp"]
max_file_kb = 500
