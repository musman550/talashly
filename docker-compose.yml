services:
  search:
    build: .
    restart: unless-stopped
    mem_limit: 700m          # 1 GB VM par OS ke liye jagah bachaye (swap alag)
    memswap_limit: 1500m
    init: true
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      - SS_SITE_URL=${SS_SITE_URL:-}
      - SS_TRUST_PROXY=${SS_TRUST_PROXY:-0}
    volumes:
      - ./data:/app/data          # index.db yahan rehta hai (backup isi folder ka)
      - ./config.toml:/app/config.toml:ro
      - ./seeds.toml:/app/seeds.toml:ro
