services:
  search:
    image: ghcr.io/musman550/talashly:latest   # GitHub Actions banata hai; na mile to VM par build ho jata hai
    build: .
    restart: unless-stopped
    mem_limit: ${SEARCH_MEM:-700m}          # 1 GB VM par OS ke liye jagah bachaye (swap alag); bari VM par .env mein SEARCH_MEM=4g
    memswap_limit: ${SEARCH_MEMSWAP:-1500m}
    init: true
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      - SS_SITE_URL=${SS_SITE_URL:-}
      - SS_TRUST_PROXY=${SS_TRUST_PROXY:-0}
    volumes:
      - ./data:/app/data          # index.db yahan rehta hai (backup isi folder ka)
      - ./config.toml:/app/config.toml:ro
      - ./seeds.toml:/app/seeds.toml:ro

  # Autopilot: 24/7 khud sawal banata, search service se poochta, yaad rakhta, report likhta (data/autopilot/report.md).
  # Chat/API/tokens ki zaroorat nahi. Band karna ho: docker compose stop autopilot
  autopilot:
    profiles: ["autopilot"]   # VM (Oracle Micro, 1/8 CPU) par default band: chalane ke liye `docker compose --profile autopilot up -d autopilot`. GitHub Action har ghante khud test karta hai.
    image: ghcr.io/musman550/talashly:latest
    build: .
    restart: unless-stopped
    mem_limit: 150m
    cpu_shares: 64   # CPU kam ho to search ko pehle
    init: true
    depends_on: [search]
    command: ["python", "-m", "engine", "autopilot", "--url", "http://search:8000"]
    environment:
      - AP_PER_MIN=${AP_PER_MIN:-1}
      - AP_LLM_URL=${AP_LLM_URL:-}
      - AP_LLM_KEY=${AP_LLM_KEY:-}
      - AP_LLM_MODEL=${AP_LLM_MODEL:-}
    volumes:
      - ./data:/app/data
      - ./config.toml:/app/config.toml:ro

  # Apna free, open-source AI writer (koi API/key nahi): sirf 6 GB+ RAM wali VM par. deploy/enable-llm.sh isay on karta hai.
  llm:
    profiles: ["llm"]
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    command: ["-hf", "${LLM_HF:-unsloth/Qwen3-1.7B-GGUF:Q4_K_M}", "--host", "0.0.0.0", "--port", "8081", "-c", "${LLM_CTX:-4096}", "-t", "${LLM_THREADS:-2}", "--parallel", "2"]
    environment:
      - LLAMA_CACHE=/models
    volumes:
      - ./data/models:/models      # model ek dafa download hota hai (~1.1 GB), phir yahin rehta hai
    mem_limit: ${LLM_MEM:-3g}
